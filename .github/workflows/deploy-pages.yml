name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

# Do not cancel an in-flight Pages build — Next.js export can take several minutes.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static site for GitHub Pages
        run: pnpm build:pages
        env:
          GH_PAGES: "1"
          NEXT_PUBLIC_SITE_URL: https://jiaxiantao.github.io/3d-car-viewing
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Sync build output into docs/
        run: |
          find docs -mindepth 1 -delete
          cp -a out/. docs/

      - name: Commit and push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes under docs/"
            exit 0
          fi
          git commit -m "deploy: refresh GitHub Pages build in docs/ [skip ci]"
          git push
