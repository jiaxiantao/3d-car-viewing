name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - name: Build static site for GitHub Pages
        run: pnpm build:pages
        env:
          GH_PAGES: "1"
          NEXT_PUBLIC_SITE_URL: https://jiaxiantao.github.io/3d-car-viewing

      - name: Add .nojekyll for GitHub Pages
        run: touch out/.nojekyll

      - name: Publish build output to docs/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: main
          destination_dir: docs
          commit_message: "deploy: refresh GitHub Pages build in docs/ [skip ci]"
