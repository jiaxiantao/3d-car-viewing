version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"
      three-r3f:
        patterns:
          - "three"
          - "@react-three/*"
        # Keep @types/three out of this group — its version must match `three`
        # (Dependabot grouped updates can resolve a non-existent @types/three).
      three-types:
        patterns:
          - "@types/three"
